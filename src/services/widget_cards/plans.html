<style>
body{margin:0;padding:14px 14px max(14px,env(safe-area-inset-bottom));font:var(--tg-text-font-size,15px)/1.35 system-ui,sans-serif;color:var(--tg-theme-text-color)}
.t{font-weight:700;font-size:1.1em;margin-bottom:12px}
button{border:0;font:inherit;color:inherit}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:8px 0;border-radius:9px;background:var(--tg-theme-secondary-bg-color);font-weight:600}
.tabs .a{background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color)}
.r{display:flex;justify-content:space-between;width:100%;padding:10px 12px;margin-top:6px;border-radius:10px;background:var(--tg-theme-secondary-bg-color);box-shadow:inset 0 0 0 2px transparent}
.r.a{box-shadow:inset 0 0 0 2px var(--tg-theme-button-color)}
.r s{color:var(--tg-theme-hint-color);font-size:.85em;margin-right:6px}
.i{color:var(--tg-theme-hint-color);font-size:.86em;margin:8px 2px 0}
#go{display:block;width:100%;margin-top:14px;padding:12px;border-radius:11px;font-weight:600;background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color)}
#st{display:block;width:100%;margin-top:4px;padding:9px;background:none;font-size:.92em;color:var(--tg-theme-link-color)}
#m{font-size:.84em;color:var(--tg-theme-hint-color);text-align:center;min-height:1em}
</style>
<div class="t">Тарифы</div>
<div class="tabs" id="tabs"></div>
<div id="ds"></div>
<div class="i" id="inf"></div>
<button id="go"></button>
<button id="st">Оплатить звёздами</button>
<div id="m"></div>
<script>
var T=window.TelegramWidget,S={},pi=0,di=0,link=null,busy=0,$=function(i){return document.getElementById(i)};
try{S=JSON.parse(T&&T.chatData||"{}")||{}}catch(e){}
var P=S.p||[];
for(var k=0;k<P.length;k++)if(P[k].i==S.s)pi=k;
function cur(){var p=P[pi]||{d:[]};return[p,p.d[di]||p.d[0]]}
function draw(){
var h="";for(var k=0;k<P.length;k++)h+='<button data-i="'+k+'"'+(k==pi?' class="a"':"")+">"+P[k].n+"</button>";
$("tabs").innerHTML=h;
var p=cur()[0],d="";for(var k=0;k<p.d.length;k++){var o=p.d[k];d+='<button class="r'+(k==di?" a":"")+'" data-d="'+k+'"><span>'+o[2]+"</span><span>"+(o[3]?"<s>"+o[3]+" ₽</s>":"")+o[1]+" ₽</span></button>"}
$("ds").innerHTML=d;$("inf").textContent=p.f||"";
var o=cur()[1];$("go").textContent=link?"Перейти к оплате":o?"Оплатить "+o[1]+" ₽":"";
$("st").style.display=link?"none":""}
function pay(kind){
var c=cur();if(busy||!T||!c[1])return;busy=1;$("m").textContent="Создаю платёж…";
T.request(kind+":"+c[0].i+":"+c[1][0]).then(function(a){busy=0;var r={};try{r=JSON.parse(a.result||"{}")}catch(e){}
if(r.u||r.t){link=r;$("m").textContent=r.a?"К оплате "+r.a:"";draw()}else $("m").textContent=r.m||"Не получилось. Попробуйте ещё раз."},
function(){busy=0;$("m").textContent="Не получилось. Попробуйте ещё раз."})}
$("tabs").onclick=function(e){var i=e.target.dataset.i;if(i!=null){pi=+i;di=0;link=null;$("m").textContent="";draw()}};
$("ds").onclick=function(e){var b=e.target.closest("[data-d]");if(b){di=+b.dataset.d;link=null;$("m").textContent="";draw()}};
$("go").onclick=function(){if(link){if(link.t)T.openTelegramLink(link.t);else T.openLink(link.u)}else pay("pay")};
$("st").onclick=function(){pay("star")};
draw();T&&T.ready&&T.ready();
</script>
